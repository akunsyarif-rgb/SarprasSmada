<!--
  Index.html — SIGAP SARPRAS Report Engine test harness (MVP, PHASE 4.5).

  BUKAN frontend final PHASE 7. Halaman ini sengaja polos (vanilla
  HTML/CSS/JS, tanpa framework/CDN eksternal) — tujuannya hanya membuat
  Report Engine benar-benar bisa dibuka dan diuji oleh pengguna nyata
  lewat URL Web App, sesuai instruksi MVP ("aplikasi yang benar-benar
  dapat dijalankan dan diuji").

  Seluruh interaksi lewat google.script.run ke fungsi publik pada
  apps-script/api/ReportApi.gs dan apps-script/api/MasterDataApi.gs.
  Validasi bisnis TIDAK diduplikasi di sini — server (Service Layer)
  tetap satu-satunya sumber kebenaran, halaman ini hanya menampilkan
  pesan sukses/gagal apa adanya.
-->
<html>
<head>
  <base target="_top">
  <style>
    body { font-family: Arial, Helvetica, sans-serif; max-width: 900px; margin: 24px auto; padding: 0 16px; color: #1a1a1a; }
    h1 { font-size: 20px; }
    h2 { font-size: 16px; margin-top: 32px; border-bottom: 1px solid #ddd; padding-bottom: 4px; }
    .muted { color: #666; font-size: 13px; }
    #whoami { padding: 10px 12px; background: #f4f4f4; border-radius: 6px; margin-bottom: 16px; }
    #whoami.error { background: #fde8e8; color: #8a1f1f; }
    form { display: flex; flex-direction: column; gap: 8px; max-width: 480px; }
    label { font-size: 13px; font-weight: bold; }
    input, select, textarea, button { font-size: 14px; padding: 6px 8px; }
    textarea { min-height: 60px; }
    button { cursor: pointer; margin-top: 8px; width: fit-content; padding: 8px 16px; }
    table { border-collapse: collapse; width: 100%; margin-top: 8px; font-size: 13px; }
    th, td { border: 1px solid #ddd; padding: 6px 8px; text-align: left; vertical-align: top; }
    th { background: #f4f4f4; }
    .msg { margin-top: 8px; font-size: 13px; padding: 6px 8px; border-radius: 4px; }
    .msg.ok { background: #e6f4ea; color: #1e6b30; }
    .msg.err { background: #fde8e8; color: #8a1f1f; }
    .status-controls { display: flex; gap: 4px; align-items: center; }
    .status-controls select, .status-controls button { font-size: 12px; padding: 3px 6px; }
  </style>
</head>
<body>
  <h1>SIGAP SARPRAS — Report Engine (Test Harness, PHASE 4.5)</h1>
  <p class="muted">Halaman uji coba minimal, BUKAN frontend final. Lihat docs/DEVELOPMENT_ROADMAP.md (PHASE 7) untuk frontend penuh.</p>

  <div id="whoami">Memuat identitas pengguna...</div>

  <h2>Buat Laporan Baru</h2>
  <form id="createForm">
    <label for="location_id">Lokasi *</label>
    <select id="location_id" required></select>

    <label for="category_id">Kategori *</label>
    <select id="category_id" required></select>

    <label for="description">Deskripsi Laporan *</label>
    <textarea id="description" required placeholder="Jelaskan kerusakan/gangguan yang ditemukan"></textarea>

    <label for="condition">Kondisi Singkat (opsional)</label>
    <input type="text" id="condition" placeholder="mis. Lampu mati total">

    <label for="impact_level">Tingkat Dampak (opsional)</label>
    <input type="text" id="impact_level" placeholder="mis. RENDAH / SEDANG / TINGGI">

    <label for="safety_risk">Risiko Keselamatan (opsional)</label>
    <input type="text" id="safety_risk" placeholder="mis. YA / TIDAK">

    <button type="submit">Kirim Laporan</button>
  </form>
  <div id="createMsg"></div>

  <h2>Daftar Laporan</h2>
  <div>
    <label for="statusFilter">Filter status:</label>
    <select id="statusFilter">
      <option value="">Semua laporan aktif</option>
    </select>
    <button id="refreshBtn" type="button">Muat Ulang</button>
  </div>
  <div id="listMsg"></div>
  <table id="reportTable">
    <thead>
      <tr>
        <th>Nomor Laporan</th>
        <th>Status</th>
        <th>Deskripsi</th>
        <th>Dibuat</th>
        <th>Aksi</th>
      </tr>
    </thead>
    <tbody id="reportTableBody"></tbody>
  </table>

  <script>
    var currentUser = null;
    var statusOptions = [];

    function showMsg(elId, text, ok) {
      var el = document.getElementById(elId);
      el.textContent = text;
      el.className = 'msg ' + (ok ? 'ok' : 'err');
    }

    function loadCurrentUser() {
      google.script.run.withSuccessHandler(function (res) {
        var el = document.getElementById('whoami');
        if (!res.success) {
          el.className = 'error';
          el.textContent = 'Tidak dapat mengidentifikasi pengguna: ' + res.error.message;
          return;
        }
        currentUser = res.data;
        el.className = '';
        el.textContent = 'Masuk sebagai: ' + currentUser.full_name + ' (' + currentUser.email + ') — peran: ' + currentUser.role +
          (currentUser.can_manage_workflow ? ' — dapat mengubah status laporan' : '');
      }).withFailureHandler(function (err) {
        var el = document.getElementById('whoami');
        el.className = 'error';
        el.textContent = 'Gagal memuat identitas: ' + err.message;
      }).apiGetCurrentUser();
    }

    function loadLocationsAndCategories() {
      google.script.run.withSuccessHandler(function (res) {
        var sel = document.getElementById('location_id');
        if (res.success) {
          res.data.forEach(function (loc) {
            var opt = document.createElement('option');
            opt.value = loc.location_id;
            opt.textContent = loc.location_path || loc.location_name;
            sel.appendChild(opt);
          });
        }
      }).apiListLocations();

      google.script.run.withSuccessHandler(function (res) {
        var sel = document.getElementById('category_id');
        if (res.success) {
          res.data.forEach(function (cat) {
            var opt = document.createElement('option');
            opt.value = cat.category_id;
            opt.textContent = cat.category_name;
            sel.appendChild(opt);
          });
        }
      }).apiListCategories();
    }

    function loadStatusOptions() {
      google.script.run.withSuccessHandler(function (res) {
        if (!res.success) { return; }
        statusOptions = res.data;
        var filterSel = document.getElementById('statusFilter');
        statusOptions.forEach(function (s) {
          var opt = document.createElement('option');
          opt.value = s;
          opt.textContent = s;
          filterSel.appendChild(opt);
        });
      }).apiGetReportStatusOptions();
    }

    function renderReports(reports) {
      var body = document.getElementById('reportTableBody');
      body.innerHTML = '';
      reports.forEach(function (r) {
        var tr = document.createElement('tr');

        var tdNumber = document.createElement('td');
        tdNumber.textContent = r.report_number;
        tr.appendChild(tdNumber);

        var tdStatus = document.createElement('td');
        tdStatus.textContent = r.status;
        tr.appendChild(tdStatus);

        var tdDesc = document.createElement('td');
        tdDesc.textContent = r.description;
        tr.appendChild(tdDesc);

        var tdCreated = document.createElement('td');
        tdCreated.textContent = r.created_at;
        tr.appendChild(tdCreated);

        var tdAction = document.createElement('td');
        if (currentUser && currentUser.can_manage_workflow) {
          var wrap = document.createElement('div');
          wrap.className = 'status-controls';

          var select = document.createElement('select');
          statusOptions.forEach(function (s) {
            var opt = document.createElement('option');
            opt.value = s;
            opt.textContent = s;
            if (s === r.status) { opt.selected = true; }
            select.appendChild(opt);
          });

          var btn = document.createElement('button');
          btn.type = 'button';
          btn.textContent = 'Ubah Status';
          btn.onclick = function () {
            var newStatus = select.value;
            btn.disabled = true;
            google.script.run.withSuccessHandler(function (res) {
              btn.disabled = false;
              if (res.success) {
                showMsg('listMsg', 'Status "' + r.report_number + '" berhasil diubah menjadi ' + res.data.status + '.', true);
                loadReports();
              } else {
                showMsg('listMsg', 'Gagal mengubah status: ' + res.error.message, false);
              }
            }).withFailureHandler(function (err) {
              btn.disabled = false;
              showMsg('listMsg', 'Gagal mengubah status: ' + err.message, false);
            }).apiChangeReportStatus(r.report_id, newStatus, '');
          };

          wrap.appendChild(select);
          wrap.appendChild(btn);
          tdAction.appendChild(wrap);
        } else {
          tdAction.textContent = '-';
        }
        tr.appendChild(tdAction);

        body.appendChild(tr);
      });
    }

    function loadReports() {
      var status = document.getElementById('statusFilter').value;
      google.script.run.withSuccessHandler(function (res) {
        if (!res.success) {
          showMsg('listMsg', 'Gagal memuat laporan: ' + res.error.message, false);
          return;
        }
        document.getElementById('listMsg').textContent = '';
        renderReports(res.data);
      }).withFailureHandler(function (err) {
        showMsg('listMsg', 'Gagal memuat laporan: ' + err.message, false);
      }).apiListReports(status || null);
    }

    document.getElementById('createForm').addEventListener('submit', function (evt) {
      evt.preventDefault();
      var payload = {
        location_id: document.getElementById('location_id').value,
        category_id: document.getElementById('category_id').value,
        description: document.getElementById('description').value,
        condition: document.getElementById('condition').value,
        impact_level: document.getElementById('impact_level').value,
        safety_risk: document.getElementById('safety_risk').value
      };
      google.script.run.withSuccessHandler(function (res) {
        if (res.success) {
          showMsg('createMsg', 'Laporan berhasil dibuat: ' + res.data.report_number, true);
          document.getElementById('createForm').reset();
          loadReports();
        } else {
          showMsg('createMsg', 'Gagal membuat laporan: ' + res.error.message, false);
        }
      }).withFailureHandler(function (err) {
        showMsg('createMsg', 'Gagal membuat laporan: ' + err.message, false);
      }).apiCreateReport(payload);
    });

    document.getElementById('refreshBtn').addEventListener('click', loadReports);
    document.getElementById('statusFilter').addEventListener('change', loadReports);

    loadCurrentUser();
    loadLocationsAndCategories();
    loadStatusOptions();
    loadReports();
  </script>
</body>
</html>
